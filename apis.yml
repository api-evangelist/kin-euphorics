  description: >-
    The Kin Euphorics Shopify storefront agent-commerce surface. Its UCP
    discovery document (/.well-known/ucp) advertises a Universal Commerce
    Protocol shopping service over MCP transport, supporting catalog search and
    lookup, cart, checkout, discounts, fulfillment, and order capabilities, with
    Google Pay, Shopify card, and Shop Pay payment handlers. Checkout requires
    explicit human approval.
