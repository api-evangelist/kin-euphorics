name: Kin Euphorics
description: >-
  Kin Euphorics is a non-alcoholic functional beverage company that makes
  "euphorics" — botanical drinks blending adaptogens, nootropics, and botanics
  formulated to lift mood, ease stress, and offer a social alternative to
  alcohol. Co-founded by Jen Batchelor and Bella Hadid, the brand sells
  ready-to-drink and mixable products such as Kin Spritz, Dream Light,
  Lightwave, and High Rhode direct to consumers through a Shopify storefront.
  That storefront exposes a modern agent-commerce surface: a UCP (Universal
  Commerce Protocol) discovery document advertising an MCP shopping endpoint for
  catalog search, cart, and checkout, alongside Shopify customer-account OpenID
  Connect for authentication and Google Pay / Shop Pay payment handlers.
